version: '3.8'

services:
  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: filecodebox-php
    restart: unless-stopped
    volumes:
      - ./php:/var/www/html
      - ./data:/var/www/html/data
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: filecodebox-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./php:/var/www/html
      - ./php/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./fcb-fronted/dist:/var/www/html/../fcb-fronted/dist
    depends_on:
      - php
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
