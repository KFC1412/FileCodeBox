# FileCodeBox PHP 版本
# Apache 虚拟主机配置文件

# 请将此文件复制到 Apache 配置目录
# Debian/Ubuntu: /etc/apache2/sites-available/filecodebox.conf
# 然后启用站点: a2ensite filecodebox.conf && a2enmod rewrite && systemctl restart apache2

# CentOS/RHEL: /etc/httpd/conf.d/filecodebox.conf
# 然后重启: systemctl restart httpd

<VirtualHost *:80>
    ServerName your-domain.com
    ServerAlias www.your-domain.com
    DocumentRoot /var/www/filecodebox/public

    <Directory /var/www/filecodebox/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # URL 重写规则
        RewriteEngine On
        RewriteBase /

        # 静态资源直接访问
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^assets/(.*)$ /assets/$1 [L]

        # 其他请求重写到 index.php
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ index.php [QSA,L]
    </Directory>

    # 日志配置
    ErrorLog ${APACHE_LOG_DIR}/filecodebox_error.log
    CustomLog ${APACHE_LOG_DIR}/filecodebox_access.log combined
    LogLevel warn

    # PHP 配置
    php_value upload_max_filesize 20M
    php_value post_max_size 25M
    php_value max_execution_time 300
    php_value max_input_time 300
    php_value memory_limit 128M
    php_value display_errors Off
    php_value log_errors On
</VirtualHost>

