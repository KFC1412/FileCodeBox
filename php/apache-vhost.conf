<VirtualHost *:80>
    ServerName filecodebox.local
    DocumentRoot /var/www/filecodebox

    <Directory /var/www/filecodebox>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /

        RewriteCond %{REQUEST_URI} ^/assets/ [OR]
        RewriteCond %{REQUEST_URI} ^/favicon\.ico$ [OR]
        RewriteCond %{REQUEST_URI} ^/robots\.txt$
        RewriteRule ^ - [L]

        RewriteCond %{REQUEST_FILENAME} -f
        RewriteRule ^ - [L]

        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]

        RewriteRule ^(.*)$ index.php [QSA,L]
    </Directory>

    <Directory /var/www/filecodebox/data>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/filecodebox_error.log
    CustomLog ${APACHE_LOG_DIR}/filecodebox_access.log combined

    php_value upload_max_filesize 20M
    php_value post_max_size 25M
    php_value max_execution_time 300
    php_value max_input_time 300
    php_value memory_limit 128M
</VirtualHost>
