<VirtualHost *:80>
    ServerName filecodebox.local
    ServerAlias www.filecodebox.local
    
    DocumentRoot /var/www/filecodebox/php
    <Directory /var/www/filecodebox/php>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    # 错误和访问日志
    ErrorLog ${APACHE_LOG_DIR}/filecodebox-error.log
    CustomLog ${APACHE_LOG_DIR}/filecodebox-access.log combined
</VirtualHost>

# SSL/TLS 配置（如需要 HTTPS）
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName filecodebox.local
    ServerAlias www.filecodebox.local
    
    DocumentRoot /var/www/filecodebox/php
    <Directory /var/www/filecodebox/php>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    SSLEngine on
    SSLCertificateFile /path/to/your/cert.pem
    SSLCertificateKeyFile /path/to/your/key.pem
    SSLCertificateChainFile /path/to/your/chain.pem
    
    # 错误和访问日志
    ErrorLog ${APACHE_LOG_DIR}/filecodebox-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/filecodebox-ssl-access.log combined
</VirtualHost>
</IfModule>
