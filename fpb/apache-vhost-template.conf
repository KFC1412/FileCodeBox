# FileCodeBox PHP 版本
# Apache 虚拟主机配置

# 请将此文件复制到 Apache 配置目录
# Debian/Ubuntu: /etc/apache2/sites-available/filecodebox.conf
# 然后执行:
#   sudo a2ensite filecodebox.conf
#   sudo a2enmod rewrite
#   sudo systemctl restart apache2

# CentOS/RHEL: /etc/httpd/conf.d/filecodebox.conf
# 然后执行:
#   sudo systemctl restart httpd

<VirtualHost *:80>
    ServerName your-domain.com
    ServerAlias www.your-domain.com
    DocumentRoot /var/www/filecodebox

    <Directory /var/www/filecodebox>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /

        # 静态资源直接访问
        RewriteCond %{REQUEST_URI} ^/assets/ [OR]
        RewriteCond %{REQUEST_URI} ^/favicon\.ico$ [OR]
        RewriteCond %{REQUEST_URI} ^/robots\.txt$
        RewriteRule ^ - [L]

        # 已存在的文件直接返回
        RewriteCond %{REQUEST_FILENAME} -f
        RewriteRule ^ - [L]

        # 已存在的目录直接返回
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]

        # 所有其他请求重写到 index.php（SPA 支持）
        RewriteRule ^(.*)$ index.php [QSA,L]
    </Directory>

    # 禁止访问 data 目录
    <Directory /var/www/filecodebox/data>
        Require all denied
    </Directory>

    # 日志配置
    ErrorLog ${APACHE_LOG_DIR}/filecodebox_error.log
    CustomLog ${APACHE_LOG_DIR}/filecodebox_access.log combined
    LogLevel warn

    # PHP 配置
    php_value upload_max_filesize 20M
    php_value post_max_size 25M
    php_value max_execution_time 300
    php_value max_input_time 300
    php_value memory_limit 128M
    php_value display_errors Off
    php_value log_errors On
</VirtualHost>

